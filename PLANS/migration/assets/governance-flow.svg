<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Light card so the diagram reads on both light and dark GitHub themes -->
  <rect x="1" y="1" width="898" height="578" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <text x="450" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">Governance — one policy, many enforcers</text>

  <!-- Source of truth -->
  <rect x="300" y="70" width="300" height="78" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="450" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">governance/protected-paths</text>
  <text x="450" y="122" text-anchor="middle" font-size="12" fill="#57606a">single source of truth</text>
  <text x="450" y="139" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#57606a">glob | owner | tier | reason</text>

  <!-- Shared checker -->
  <rect x="330" y="210" width="240" height="60" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="450" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">protected-paths-check.sh</text>
  <text x="450" y="256" text-anchor="middle" font-size="12" fill="#57606a">the one shared checker</text>

  <!-- Arrow source -> checker -->
  <line x1="450" y1="148" x2="450" y2="208" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Enforcer row -->
  <g>
    <rect x="40" y="380" width="185" height="86" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="132" y="410" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2328">CODEOWNERS review</text>
    <text x="132" y="430" text-anchor="middle" font-size="11.5" fill="#1a7f37" font-weight="600">merge gate of record</text>
    <text x="132" y="450" text-anchor="middle" font-size="11" fill="#57606a">blocks unreviewed merge</text>
  </g>
  <g>
    <rect x="245" y="380" width="185" height="86" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
    <text x="337" y="410" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2328">CI policy-guard</text>
    <text x="337" y="430" text-anchor="middle" font-size="11.5" fill="#57606a" font-weight="600">advisory</text>
    <text x="337" y="450" text-anchor="middle" font-size="11" fill="#57606a">annotates + tier labels</text>
  </g>
  <g>
    <rect x="470" y="380" width="185" height="86" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
    <text x="562" y="410" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2328">git hooks</text>
    <text x="562" y="430" text-anchor="middle" font-size="11.5" fill="#57606a" font-weight="600">local catch</text>
    <text x="562" y="450" text-anchor="middle" font-size="11" fill="#57606a">pre-commit / pre-push</text>
  </g>
  <g>
    <rect x="675" y="380" width="185" height="86" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
    <text x="767" y="410" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2328">notify-critical.sh</text>
    <text x="767" y="430" text-anchor="middle" font-size="11.5" fill="#cf222e" font-weight="600">critical-path alert</text>
    <text x="767" y="450" text-anchor="middle" font-size="11" fill="#57606a">push notification</text>
  </g>

  <!-- Arrows checker -> enforcers -->
  <line x1="450" y1="270" x2="132" y2="378" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="450" y1="270" x2="337" y2="378" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="450" y1="270" x2="562" y2="378" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="450" y1="270" x2="767" y2="378" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- generate-codeowners note -->
  <text x="120" y="345" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8250df">via generate-codeowners.sh</text>

  <text x="450" y="520" text-anchor="middle" font-size="12" fill="#57606a">Every enforcer reads the same policy file. Change the policy → regenerate CODEOWNERS → all four stay in sync.</text>
  <text x="450" y="546" text-anchor="middle" font-size="11.5" fill="#8c959f">Bypassable locally (git hooks); server-side gate (CODEOWNERS) is the guarantee of what merges.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
    </marker>
  </defs>
</svg>
