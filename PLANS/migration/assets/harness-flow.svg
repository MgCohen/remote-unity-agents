<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="898" height="558" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <text x="450" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">Test harness — the Rulebook ratchet</text>
  <text x="450" y="66" text-anchor="middle" font-size="12.5" fill="#57606a">A test never lands alone — it lands with the Rule it proves.</text>

  <!-- Rulebook side -->
  <rect x="45" y="110" width="255" height="230" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="172" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">Rulebook.md</text>
  <text x="172" y="157" text-anchor="middle" font-size="11" fill="#57606a">plain-English guarantees</text>
  <line x1="70" y1="170" x2="275" y2="170" stroke="#0969da" stroke-opacity="0.3" stroke-width="1"/>
  <text x="70" y="200" font-size="13" font-family="monospace" fill="#1f2328">### Reverse of empty → empty</text>
  <text x="70" y="238" font-size="13" font-family="monospace" fill="#1f2328">### Deps flow down only</text>
  <text x="70" y="276" font-size="13" font-family="monospace" fill="#1f2328">### Every project has a home</text>
  <text x="70" y="314" font-size="11.5" font-style="italic" fill="#57606a">each `###` header = one Rule</text>

  <!-- Facts side -->
  <rect x="600" y="110" width="255" height="230" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="727" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">xUnit facts</text>
  <text x="727" y="157" text-anchor="middle" font-size="11" fill="#57606a">the asserting test code</text>
  <line x1="625" y1="170" x2="830" y2="170" stroke="#1a7f37" stroke-opacity="0.3" stroke-width="1"/>
  <text x="625" y="200" font-size="12.5" font-family="monospace" fill="#1f2328">[Rule("Reverse of empty…")]</text>
  <text x="625" y="238" font-size="12.5" font-family="monospace" fill="#1f2328">[Rule("Deps flow down only")]</text>
  <text x="625" y="276" font-size="12.5" font-family="monospace" fill="#1f2328">[Rule("Every project has…")]</text>
  <text x="625" y="314" font-size="11.5" font-style="italic" fill="#57606a">one Rule → 1..N facts allowed</text>

  <!-- ParityGuard -->
  <rect x="360" y="150" width="180" height="100" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="450" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">ParityGuard</text>
  <text x="450" y="210" text-anchor="middle" font-size="11.5" fill="#57606a">matches headers ⇄ facts</text>
  <text x="450" y="230" text-anchor="middle" font-size="11.5" fill="#57606a">by exact name</text>

  <!-- double arrows -->
  <line x1="300" y1="200" x2="358" y2="200" stroke="#8c959f" stroke-width="1.8" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
  <line x1="542" y1="200" x2="598" y2="200" stroke="#8c959f" stroke-width="1.8" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>

  <!-- outcomes -->
  <line x1="450" y1="250" x2="450" y2="300" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <rect x="150" y="400" width="270" height="70" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="285" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#1a7f37">names match → build green</text>
  <text x="285" y="452" text-anchor="middle" font-size="11.5" fill="#57606a">every Rule proven, every fact cited</text>

  <rect x="480" y="400" width="270" height="70" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="615" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#cf222e">mismatch → build FAILS</text>
  <text x="615" y="452" text-anchor="middle" font-size="11.5" fill="#57606a">orphan Rule, or fact with no Rule</text>

  <line x1="450" y1="300" x2="285" y2="398" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <line x1="450" y1="300" x2="615" y2="398" stroke="#8c959f" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <rect x="405" y="285" width="90" height="26" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1"/>
  <text x="450" y="303" text-anchor="middle" font-size="12" fill="#1f2328">outcome</text>

  <text x="450" y="510" text-anchor="middle" font-size="12" fill="#57606a">Add Rules freely (tightens guarantees). Removing or reshaping one is a design decision, not a cleanup.</text>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
    </marker>
  </defs>
</svg>
