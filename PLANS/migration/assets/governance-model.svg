<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Governance is the main system managing four subsystems, all expressing structure over prose">
  <rect x="1" y="1" width="918" height="558" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Thesis band -->
  <rect x="26" y="26" width="868" height="58" rx="10" fill="#eef2f8" stroke="#9aa8bd" stroke-width="1.3"/>
  <text x="460" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">STRUCTURE OVER PROSE</text>
  <text x="460" y="72" text-anchor="middle" font-size="12" fill="#57606a">the agent-first wager — rules are structure the machine checks, not prose humans are trusted to follow</text>

  <!-- Governance (main system) -->
  <rect x="300" y="112" width="320" height="72" rx="11" fill="#dfe7f5" stroke="#2457c5" stroke-width="2"/>
  <text x="460" y="142" text-anchor="middle" font-size="17" font-weight="750" fill="#1f2328">GOVERNANCE</text>
  <text x="460" y="164" text-anchor="middle" font-size="12" fill="#57606a">the main system — one policy (protected-paths), one shared checker</text>

  <text x="460" y="206" text-anchor="middle" font-size="11.5" font-style="italic" fill="#8250df">manages ▾</text>

  <!-- Subsystems -->
  <g>
    <rect x="34" y="228" width="200" height="150" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/>
    <text x="134" y="256" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2328">Test Harness</text>
    <text x="134" y="274" text-anchor="middle" font-size="11" fill="#0969da" font-weight="600">Rulebook discipline</text>
    <line x1="52" y1="286" x2="216" y2="286" stroke="#0969da" stroke-opacity="0.25"/>
    <text x="134" y="306" text-anchor="middle" font-size="11" fill="#57606a">declare a guarantee</text>
    <text x="134" y="323" text-anchor="middle" font-size="11" fill="#57606a">as a Rule → prove it</text>
    <text x="134" y="340" text-anchor="middle" font-size="11" fill="#57606a">with a [Rule] test.</text>
    <text x="134" y="362" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8c959f">ParityGuard keeps lockstep</text>
  </g>
  <g>
    <rect x="248" y="228" width="200" height="150" rx="10" fill="#f3ebfc" stroke="#8250df" stroke-width="1.6"/>
    <text x="348" y="256" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2328">Doc Engine</text>
    <text x="348" y="274" text-anchor="middle" font-size="11" fill="#8250df" font-weight="600">structure for documents</text>
    <line x1="266" y1="286" x2="430" y2="286" stroke="#8250df" stroke-opacity="0.25"/>
    <text x="348" y="306" text-anchor="middle" font-size="11" fill="#57606a">kinds → doctypes →</text>
    <text x="348" y="323" text-anchor="middle" font-size="11" fill="#57606a">block instances →</text>
    <text x="348" y="340" text-anchor="middle" font-size="11" fill="#57606a">validate in place.</text>
    <text x="348" y="362" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8c959f">defines a Rulebook's shape</text>
  </g>
  <g>
    <rect x="462" y="228" width="200" height="150" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/>
    <text x="562" y="256" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2328">CODEOWNERS / CI</text>
    <text x="562" y="274" text-anchor="middle" font-size="11" fill="#1a7f37" font-weight="600">server-side gate</text>
    <line x1="480" y1="286" x2="644" y2="286" stroke="#1a7f37" stroke-opacity="0.25"/>
    <text x="562" y="306" text-anchor="middle" font-size="11" fill="#57606a">required review =</text>
    <text x="562" y="323" text-anchor="middle" font-size="11" fill="#57606a">merge gate of record;</text>
    <text x="562" y="340" text-anchor="middle" font-size="11" fill="#57606a">CI labels + alerts.</text>
    <text x="562" y="362" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8c959f">+ bot/owner identity split</text>
  </g>
  <g>
    <rect x="676" y="228" width="200" height="150" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.6"/>
    <text x="776" y="256" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2328">Hooks</text>
    <text x="776" y="274" text-anchor="middle" font-size="11" fill="#57606a" font-weight="600">local catch</text>
    <line x1="694" y1="286" x2="858" y2="286" stroke="#57606a" stroke-opacity="0.25"/>
    <text x="776" y="306" text-anchor="middle" font-size="11" fill="#57606a">pre-commit / pre-push</text>
    <text x="776" y="323" text-anchor="middle" font-size="11" fill="#57606a">block protected edits</text>
    <text x="776" y="340" text-anchor="middle" font-size="11" fill="#57606a">before they're pushed.</text>
    <text x="776" y="362" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8c959f">opt-in, bypassable</text>
  </g>

  <!-- manage arrows -->
  <line x1="400" y1="184" x2="134" y2="226" stroke="#8c959f" stroke-width="1.6" marker-end="url(#gm)"/>
  <line x1="435" y1="184" x2="348" y2="226" stroke="#8c959f" stroke-width="1.6" marker-end="url(#gm)"/>
  <line x1="485" y1="184" x2="562" y2="226" stroke="#8c959f" stroke-width="1.6" marker-end="url(#gm)"/>
  <line x1="520" y1="184" x2="776" y2="226" stroke="#8c959f" stroke-width="1.6" marker-end="url(#gm)"/>

  <!-- governed vs distributed note -->
  <rect x="34" y="410" width="842" height="118" rx="10" fill="#fbfcfe" stroke="#e1e6eb"/>
  <text x="52" y="436" font-size="12.5" font-weight="700" fill="#1f2328">The one seam to remember</text>
  <text x="52" y="459" font-size="12" fill="#57606a">Declarations are governed; proof is distributed. Every Rulebook, rubric, and doctype is protected (central,</text>
  <text x="52" y="477" font-size="12" fill="#57606a">owner-reviewed) — the Rules live inside governance. The only thing that lives outside the wall is the</text>
  <text x="52" y="495" font-size="12" fill="#57606a">specific [Rule] test code, co-located with the feature it protects.</text>
  <text x="52" y="518" font-size="11.5" font-style="italic" fill="#8250df">Port the machinery; re-author the content. The Rules describe the old product — rewrite them, don't copy.</text>

  <defs>
    <marker id="gm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker>
  </defs>
</svg>
