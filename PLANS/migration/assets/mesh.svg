<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="The five layers interlock three ways — shared artifact, direct call, event — with no central hub">
  <rect x="1" y="1" width="918" height="448" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="460" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">How the layers interlock — no boss, three ways to connect</text>

  <!-- legend -->
  <rect x="632" y="52" width="256" height="86" rx="9" fill="#fbfcfe" stroke="#e1e6eb"/>
  <line x1="648" y1="72" x2="684" y2="72" stroke="#57606a" stroke-width="2"/>
  <text x="694" y="76" font-size="11" fill="#1f2328">shared artifact (one file, two roles)</text>
  <line x1="648" y1="96" x2="684" y2="96" stroke="#57606a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="694" y="100" font-size="11" fill="#1f2328">direct call</text>
  <line x1="648" y1="120" x2="684" y2="120" stroke="#64748b" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round"/>
  <text x="694" y="124" font-size="11" fill="#1f2328">event (Hooks — the automatic path)</text>

  <!-- Doc Engine (top) -->
  <rect x="370" y="80" width="180" height="58" rx="10" fill="#f3ebfc" stroke="#8250df" stroke-width="1.6"/>
  <text x="460" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2328">Doc Engine</text>
  <text x="460" y="124" text-anchor="middle" font-size="10.5" fill="#57606a">doc structure / schema</text>

  <!-- Test Harness (bottom-left) -->
  <rect x="90" y="210" width="180" height="58" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/>
  <text x="180" y="236" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2328">Test Harness</text>
  <text x="180" y="254" text-anchor="middle" font-size="10.5" fill="#57606a">Rule ⇄ proof</text>

  <!-- Judge (bottom-right) -->
  <rect x="650" y="210" width="180" height="58" rx="10" fill="#dbf1ef" stroke="#0f766e" stroke-width="1.6"/>
  <text x="740" y="236" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2328">Judge</text>
  <text x="740" y="254" text-anchor="middle" font-size="10.5" fill="#57606a">rubric grading</text>

  <!-- triangle edges -->
  <line x1="392" y1="138" x2="212" y2="208" stroke="#57606a" stroke-width="2" marker-end="url(#me)"/>
  <text x="232" y="168" font-size="10.5" fill="#1f2328" font-weight="600">shared artifact</text>
  <text x="232" y="182" font-size="9.5" fill="#8c959f">Rulebook = test decl + doctype</text>

  <line x1="528" y1="138" x2="708" y2="208" stroke="#57606a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#me)"/>
  <text x="612" y="168" font-size="10.5" fill="#1f2328" font-weight="600">direct call</text>
  <text x="612" y="182" font-size="9.5" fill="#8c959f">reviewers → judge</text>

  <line x1="270" y1="245" x2="648" y2="245" stroke="#57606a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#me)"/>
  <text x="460" y="238" text-anchor="middle" font-size="10.5" fill="#1f2328" font-weight="600">direct call — authoring grading</text>

  <!-- Hooks -->
  <rect x="370" y="330" width="180" height="58" rx="10" fill="#f4f6f8" stroke="#64748b" stroke-width="1.6"/>
  <text x="460" y="356" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2328">Hooks</text>
  <text x="460" y="374" text-anchor="middle" font-size="10.5" fill="#57606a">automatic reactions on events</text>

  <line x1="405" y1="330" x2="215" y2="270" stroke="#64748b" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" marker-end="url(#me2)"/>
  <line x1="460" y1="330" x2="460" y2="140" stroke="#64748b" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" marker-end="url(#me2)"/>
  <line x1="515" y1="330" x2="705" y2="270" stroke="#64748b" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" marker-end="url(#me2)"/>
  <text x="460" y="410" text-anchor="middle" font-size="11" fill="#57606a">The trio already interlocks via shared artifacts and direct calls. Hooks only adds the automatic path — "whenever someone touches it."</text>
  <text x="460" y="430" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8250df">CODEOWNERS/CI sits over all of it as the gate; the one thing every layer reads is the policy — that shared source of truth, not a hub, is the connector.</text>

  <defs>
    <marker id="me" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker>
    <marker id="me2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
</svg>
