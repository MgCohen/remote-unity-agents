<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Doc Engine: a dump is distilled into a block instance, then the on-change pipeline validates, checks, and reviews it">
  <rect x="1" y="1" width="918" height="468" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="460" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">Doc Engine — structure for documents</text>
  <text x="460" y="60" text-anchor="middle" font-size="12" fill="#57606a">a freeform dump becomes a validated block instance; changing it fires a reaction pipeline</text>

  <!-- authoring row -->
  <rect x="40" y="92" width="150" height="58" rx="9" fill="#f6f8fa" stroke="#57606a" stroke-width="1.4"/>
  <text x="115" y="116" text-anchor="middle" font-size="12.5" font-weight="650" fill="#1f2328">dump</text>
  <text x="115" y="134" text-anchor="middle" font-size="10.5" fill="#8c959f">brain-dump, ephemeral</text>

  <rect x="250" y="92" width="180" height="58" rx="9" fill="#f3ebfc" stroke="#8250df" stroke-width="1.6"/>
  <text x="340" y="114" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2328">instance.md</text>
  <text x="340" y="132" text-anchor="middle" font-size="10.5" fill="#57606a">blocks · in its home folder</text>

  <line x1="190" y1="121" x2="248" y2="121" stroke="#8c959f" stroke-width="1.8" marker-end="url(#de)"/>
  <text x="219" y="112" text-anchor="middle" font-size="10" font-style="italic" fill="#8250df">distill</text>

  <rect x="500" y="92" width="180" height="58" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/>
  <text x="590" y="114" text-anchor="middle" font-size="11.5" fill="#1f2328">conforms to</text>
  <text x="590" y="132" text-anchor="middle" font-size="11" font-family="monospace" fill="#1f2328">doctypes/*.yaml</text>
  <line x1="430" y1="121" x2="498" y2="121" stroke="#8c959f" stroke-width="1.8" marker-end="url(#de)"/>
  <text x="464" y="112" text-anchor="middle" font-size="10" font-style="italic" fill="#0969da">validate</text>

  <text x="795" y="116" text-anchor="middle" font-size="11" fill="#57606a">the meta-schema →</text>
  <text x="795" y="132" text-anchor="middle" font-size="11" fill="#57606a">kinds → doctypes</text>
  <line x1="680" y1="121" x2="712" y2="121" stroke="#c4ccd6" stroke-width="1.4"/>

  <!-- on-change pipeline -->
  <rect x="40" y="196" width="840" height="176" rx="11" fill="#fbfcfe" stroke="#e1e6eb"/>
  <text x="60" y="222" font-size="12.5" font-weight="700" fill="#1f2328">The on-change reaction pipeline</text>
  <text x="60" y="242" font-size="11" fill="#8c959f">fired by a Hooks event (TurnEnded / CommitLanded) via tools/doc-engine/on-doc-change.hook — mode: check</text>

  <rect x="70" y="262" width="200" height="78" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="170" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">validate</text>
  <text x="170" y="310" text-anchor="middle" font-size="10.5" fill="#57606a">structure conforms?</text>
  <text x="170" y="328" text-anchor="middle" font-size="10.5" fill="#cf222e" font-weight="600">BLOCKS on fail</text>

  <rect x="360" y="262" width="200" height="78" rx="9" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="460" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">checks</text>
  <text x="460" y="310" text-anchor="middle" font-size="10.5" fill="#57606a">deterministic scripts</text>
  <text x="460" y="328" text-anchor="middle" font-size="10.5" fill="#cf222e" font-weight="600">BLOCKS on fail</text>

  <rect x="650" y="262" width="200" height="78" rx="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="750" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">reviewers</text>
  <text x="750" y="310" text-anchor="middle" font-size="10.5" fill="#57606a">fresh agents, judge</text>
  <text x="750" y="328" text-anchor="middle" font-size="10.5" fill="#1a7f37" font-weight="600">ADVISES</text>

  <line x1="270" y1="301" x2="358" y2="301" stroke="#8c959f" stroke-width="1.8" marker-end="url(#de)"/>
  <line x1="560" y1="301" x2="648" y2="301" stroke="#8c959f" stroke-width="1.8" marker-end="url(#de)"/>

  <defs>
    <marker id="de" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker>
  </defs>
</svg>
