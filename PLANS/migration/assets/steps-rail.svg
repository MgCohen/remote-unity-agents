<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 210" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Migration order: seven steps from decisions to the GitHub ruleset; Doc Engine is deferrable">
  <rect x="1" y="1" width="918" height="208" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="460" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Migration order — each step leaves the repo buildable</text>

  <line x1="70" y1="92" x2="868" y2="92" stroke="#c4ccd6" stroke-width="2"/>

  <!-- nodes -->
  <g>
    <circle cx="70" cy="92" r="19" fill="#2457c5"/><text x="70" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">0</text>
    <text x="70" y="132" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">Decisions</text>
  </g>
  <g>
    <circle cx="203" cy="92" r="19" fill="#2457c5"/><text x="203" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
    <text x="203" y="132" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">Build seam</text>
  </g>
  <g>
    <circle cx="336" cy="92" r="19" fill="#2457c5"/><text x="336" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
    <text x="336" y="132" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">Governance</text>
    <text x="336" y="147" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">core</text>
  </g>
  <g>
    <circle cx="469" cy="92" r="19" fill="#0969da"/><text x="469" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
    <text x="469" y="132" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">Test Harness</text>
  </g>
  <g>
    <circle cx="602" cy="92" r="19" fill="#0969da"/><text x="602" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text>
    <text x="602" y="132" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">Central tests</text>
    <text x="602" y="147" text-anchor="middle" font-size="10.5" fill="#8c959f">re-author</text>
  </g>
  <g>
    <circle cx="735" cy="92" r="19" fill="#ffffff" stroke="#8250df" stroke-width="2" stroke-dasharray="4 3"/><text x="735" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#8250df">5</text>
    <text x="735" y="132" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">Doc Engine</text>
    <text x="735" y="147" text-anchor="middle" font-size="10.5" fill="#8250df" font-weight="600">deferrable</text>
  </g>
  <g>
    <circle cx="868" cy="92" r="19" fill="#1a7f37"/><text x="868" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">6</text>
    <text x="868" y="132" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">CI + Hooks</text>
    <text x="868" y="147" text-anchor="middle" font-size="10.5" fill="#8c959f">+ ruleset</text>
  </g>

  <text x="460" y="190" text-anchor="middle" font-size="11.5" fill="#57606a">Walking skeleton first: a green build at Step 4, then Doc Engine (the largest piece) and the server-side gate. Solid = core path · dashed = defer without blocking.</text>
</svg>
