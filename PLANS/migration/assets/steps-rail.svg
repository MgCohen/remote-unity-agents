<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 210" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Migration order: eight steps from decisions to the GitHub ruleset; Judge and Doc Engine are deferrable">
  <rect x="1" y="1" width="918" height="208" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="460" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Migration order — each step leaves the repo buildable</text>

  <line x1="58" y1="88" x2="863" y2="88" stroke="#c4ccd6" stroke-width="2"/>

  <circle cx="58" cy="88" r="17" fill="#2457c5"/><text x="58" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">0</text>
  <text x="58" y="124" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f2328">Decisions</text>

  <circle cx="173" cy="88" r="17" fill="#2457c5"/><text x="173" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="173" y="124" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f2328">Build seam</text>

  <circle cx="288" cy="88" r="17" fill="#2457c5"/><text x="288" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="288" y="124" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f2328">Governance</text>
  <text x="288" y="138" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f2328">core</text>

  <circle cx="403" cy="88" r="17" fill="#0969da"/><text x="403" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="403" y="124" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f2328">Test Harness</text>

  <circle cx="518" cy="88" r="17" fill="#0969da"/><text x="518" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <text x="518" y="124" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f2328">Central tests</text>
  <text x="518" y="138" text-anchor="middle" font-size="9.5" fill="#8c959f">re-author</text>

  <circle cx="633" cy="88" r="17" fill="#ffffff" stroke="#0f766e" stroke-width="2" stroke-dasharray="4 3"/><text x="633" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">5</text>
  <text x="633" y="124" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f2328">Judge</text>
  <text x="633" y="138" text-anchor="middle" font-size="9.5" fill="#0f766e" font-weight="600">deferrable</text>

  <circle cx="748" cy="88" r="17" fill="#ffffff" stroke="#8250df" stroke-width="2" stroke-dasharray="4 3"/><text x="748" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#8250df">6</text>
  <text x="748" y="124" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f2328">Doc Engine</text>
  <text x="748" y="138" text-anchor="middle" font-size="9.5" fill="#8250df" font-weight="600">deferrable</text>

  <circle cx="863" cy="88" r="17" fill="#1a7f37"/><text x="863" y="93" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">7</text>
  <text x="863" y="124" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f2328">Gate + Hooks</text>
  <text x="863" y="138" text-anchor="middle" font-size="9.5" fill="#8c959f">+ ruleset</text>

  <text x="460" y="184" text-anchor="middle" font-size="11" fill="#57606a">Walking skeleton first: a green build at Step 4, then the semantic + doc layers, then the server-side gate. Solid = core · dashed = deferrable.</text>
</svg>
